  <rect x="13" y="4" width="6" height="24" rx="2" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="6" y1="8" x2="6" y2="26" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="26" y1="8" x2="26" y2="26" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="6" y1="16" x2="26" y2="16" stroke="#c2410c" stroke-width="2.5"/>
  <circle cx="26" cy="16" r="2.5" fill="#c2410c"/>
</svg>
